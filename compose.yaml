name: kely-local
services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: kely
      POSTGRES_PASSWORD: kely_local_only
      POSTGRES_DB: kely_fixture
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - kely_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kely -d kely_fixture"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  kely_postgres:
