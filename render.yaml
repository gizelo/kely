services:
  - type: web
    name: kely-beta
    runtime: docker
    plan: free
    region: frankfurt
    autoDeploy: false
    healthCheckPath: /api/health
    preDeployCommand: node --import tsx scripts/migrate.ts
    envVars:
      - key: KELY_RUNTIME
        value: cloud
      - key: KELY_PROVIDER_MODE
        value: fixture
      - key: KELY_LIVE_ENABLED
        value: "false"
      - key: KELY_BASE_URL
        sync: false
      - key: KELY_DATABASE_URL
        sync: false
      - key: KELY_STORAGE_URL
        sync: false
      - key: KELY_STORAGE_SERVICE_KEY
        sync: false
      - key: KELY_STORAGE_BUCKET
        value: kely-private
      - key: KELY_AUTH_SECRET
        generateValue: true
      - key: KELY_BUDGET_DESTINATION
        value: kely-render-beta-20260913
